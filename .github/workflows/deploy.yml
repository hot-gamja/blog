name: Deploy to EC2

# main 브랜치에 push(=PR 머지)될 때 실행
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # hot-gamja/blog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # GitHub Container Registry 쓰기 권한
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정 (멀티플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. GitHub Container Registry 로그인
      # GITHUB_TOKEN은 GitHub Actions가 자동으로 제공 (별도 설정 불필요)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker 이미지 빌드 & push
      # 레이어 캐시 사용으로 빌드 속도 향상
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. docker-compose.prod.yml을 EC2에 복사
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: docker-compose.prod.yml
          target: /opt/myapp

      # 6. EC2에 SSH 접속 후 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          script: |
            set -e  # 명령어 실패 시 즉시 중단

            # GitHub Container Registry 로그인
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            # compose가 참조할 .env 파일 생성
            cat > /opt/myapp/.env <<EOF
            GITHUB_REPOSITORY=$GITHUB_REPOSITORY
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            EOF

            # 최신 이미지 pull 후 변경된 서비스만 재시작
            docker compose -f /opt/myapp/docker-compose.prod.yml --env-file /opt/myapp/.env pull
            docker compose -f /opt/myapp/docker-compose.prod.yml --env-file /opt/myapp/.env up -d

            echo "Deploy complete!"
